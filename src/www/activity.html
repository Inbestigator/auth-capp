<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authorizing</title>
    <script>
      const params = new URLSearchParams(window.location.search);
      if (params.get("theme") === "light") {
        document.documentElement.classList.add("light");
      }
    </script>
    <style>
      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #fafafa;
        background: #09090b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: end;
        align-items: center;
        flex-direction: column;
      }

      footer {
        padding: 0 0 1rem 0;
        color: color-mix(in oklab, currentColor 50%, transparent);
        font-size: x-small;
      }

      footer span {
        color: color-mix(in oklab, blue 50%, currentColor);
        cursor: pointer;
        text-decoration: underline;
      }

      #root {
        position: relative;
      }

      #loader {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        margin-bottom: 8rem;
        border: 1px solid #27272a;
        border-radius: 1rem;
        background: #18181b;
        color: color-mix(in oklab, currentColor 75%, transparent);
        font-size: smaller;
        font-weight: 500;
        line-height: 1.25rem;
      }

      #loader svg {
        width: 1rem;
        height: 1rem;
        flex-shrink: 0;
      }

      #loader .loader-icon {
        color: #a1a1aa;
        animation: spin 0.8s linear infinite;
      }

      #loader.success .loader-icon {
        color: #22c55e;
        animation: none;
      }

      #loader.error .loader-icon {
        color: #ef4444;
        animation: none;
      }

      :root.light {
        color: #18181b;
        background: #fafafa;
      }

      :root.light #loader {
        border-color: #e4e4e7;
        background: #ffffff;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.05),
          0 0 0 1px rgba(0, 0, 0, 0.01);
      }

      :root.light #loader .loader-icon {
        color: #71717a;
      }

      :root.light #loader.success .loader-icon {
        color: #16a34a;
      }

      :root.light #loader.error .loader-icon {
        color: #dc2626;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #loader .loader-icon {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <altcha-widget challenge="/api/challenge" display="invisible" auto="onload"></altcha-widget>
    <div id="loader">
      <svg
        id="loader-icon"
        class="loader-icon"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 2v4" />
        <path d="m16.2 7.8 2.9-2.9" />
        <path d="M18 12h4" />
        <path d="m16.2 16.2 2.9 2.9" />
        <path d="M12 18v4" />
        <path d="m4.9 19.1 2.9-2.9" />
        <path d="M2 12h4" />
        <path d="m4.9 4.9 2.9 2.9" />
      </svg>
      <span id="loader-text">Completing CAPTCHA...</span>
    </div>
    <footer>
      This service is
      <span id="oss-link">open source</span>.
    </footer>
    <script type="module" src="./activity.ts"></script>
  </body>
</html>
