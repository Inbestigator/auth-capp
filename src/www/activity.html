<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authorizing</title>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      const params = new URLSearchParams(window.location.search);
      document.documentElement.classList.add(params.get("theme") === "light" ? "light" : "dark");
    </script>
    <style>
      body {
        display: flex;
        justify-content: end;
        align-items: center;
        flex-direction: column;
        line-height: normal;
      }

      footer {
        padding: 0 0 1rem 0;
        color: var(--faint);
        font-size: x-small;
      }

      footer span {
        color: var(--link);
        cursor: pointer;
        text-decoration: underline;
      }

      #loader {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        margin-bottom: 8rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
        color: color-mix(in oklab, currentColor 75%, transparent);
        font-size: smaller;
        font-weight: 500;
        line-height: 1.25rem;
      }

      #loader svg {
        width: 1rem;
        height: 1rem;
        flex-shrink: 0;
      }

      #loader .loader-icon {
        color: var(--icon);
        animation: spin 0.8s linear infinite;
      }

      #loader.success .loader-icon {
        color: var(--success);
        animation: none;
      }

      #loader.error .loader-icon {
        color: var(--danger);
        animation: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <altcha-widget challenge="/api/challenge" display="invisible" auto="onload"></altcha-widget>
    <div id="loader">
      <svg
        id="loader-icon"
        class="loader-icon"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 2v4" />
        <path d="m16.2 7.8 2.9-2.9" />
        <path d="M18 12h4" />
        <path d="m16.2 16.2 2.9 2.9" />
        <path d="M12 18v4" />
        <path d="m4.9 19.1 2.9-2.9" />
        <path d="M2 12h4" />
        <path d="m4.9 4.9 2.9 2.9" />
      </svg>
      <span id="loader-text">Completing CAPTCHA...</span>
    </div>
    <footer>
      This service is
      <span id="oss-link">open source</span>.
    </footer>
    <script type="module" src="./activity.ts"></script>
  </body>
</html>
